# Local infrastructure for TestPilot AI.
#
#   docker compose -f infrastructure/docker/docker-compose.yml up -d            # dependencies only
#   docker compose -f infrastructure/docker/docker-compose.yml --profile app up  # + api, worker, web
#
# Credentials below are for LOCAL DEVELOPMENT ONLY.
name: testpilot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testpilot
      POSTGRES_PASSWORD: testpilot
      POSTGRES_DB: testpilot
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testpilot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible object storage for screenshots, videos and reports (used from Phase 4).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: testpilot
      MINIO_ROOT_PASSWORD: testpilot-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # Catches outgoing email locally (UI on http://localhost:8025). Use SMTP_URL=smtp://localhost:1025
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["1025:1025", "8025:8025"]

  migrate:
    profiles: ["app"]
    build: { context: ../.., dockerfile: infrastructure/docker/Dockerfile.api }
    command: ["pnpm", "--filter", "@testpilot/database", "migrate:deploy"]
    environment:
      DATABASE_URL: postgresql://testpilot:testpilot@postgres:5432/testpilot
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: ["app"]
    build: { context: ../.., dockerfile: infrastructure/docker/Dockerfile.api }
    env_file: ../../.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://testpilot:testpilot@postgres:5432/testpilot
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailpit:1025
      WEB_URL: http://localhost:3000
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build: { context: ../.., dockerfile: infrastructure/docker/Dockerfile.worker }
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://testpilot:testpilot@postgres:5432/testpilot
    # Resource limits (browser workers in later phases get stricter isolation).
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      redis: { condition: service_healthy }

  web:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args: { API_URL: "http://api:4000" }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  miniodata:
